<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#aed8f2"/>
      <stop offset="55%" stop-color="#74b6e0"/>
      <stop offset="100%" stop-color="#4a93c7"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd875"/>
      <stop offset="60%" stop-color="#f0a63a"/>
      <stop offset="100%" stop-color="#d98a24"/>
    </radialGradient>
  </defs>

  <!-- 头顶一朵小乌云（伤心氛围） -->
  <g opacity="0.8">
    <path d="M100 26 Q94 16 102 12 Q110 14 109 22 Q116 18 120 24 Q114 30 106 30 Z" fill="#9aa7b5"/>
    <path d="M132 28 Q126 20 134 16 Q142 18 141 26 Q148 22 151 28 Q145 34 137 34 Z" fill="#9aa7b5"/>
    <path d="M112 20 l-5 -4" stroke="#7d8a99" stroke-width="2" stroke-linecap="round"/>
    <path d="M122 16 l0 -5" stroke="#7d8a99" stroke-width="2" stroke-linecap="round"/>
    <path d="M132 18 l5 -4" stroke="#7d8a99" stroke-width="2" stroke-linecap="round"/>
  </g>

  <ellipse cx="120" cy="156" rx="60" ry="18" fill="#74b6e0" opacity="0.08"/>

  <!-- 小角（耷拉） -->
  <path d="M70 68 Q62 48 76 36 Q84 50 82 66 Z" fill="#c9ddee" stroke="#8fc2e4" stroke-width="2"/>
  <path d="M170 68 Q178 48 164 36 Q156 50 158 66 Z" fill="#c9ddee" stroke="#8fc2e4" stroke-width="2"/>

  <!-- 主体（微微低下头：整体稍微下移一点） -->
  <ellipse cx="120" cy="145" rx="72" ry="76" fill="url(#bodyGrad)" stroke="#6fb0dc" stroke-width="2.5"/>

  <!-- 软fufu顶也耷拉 -->
  <path d="M80 88 Q90 70 108 74 Q100 60 120 58 Q140 60 132 74 Q150 72 160 88" fill="none" stroke="#c9e6f7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <ellipse cx="98" cy="106" rx="18" ry="12" fill="#ffffff" opacity="0.3"/>

  <!-- 伤心：下垂的眉毛 -->
  <path d="M88 120 Q98 116 108 121" stroke="#2f5a80" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M132 121 Q142 116 152 120" stroke="#2f5a80" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 伤心眼：半闭、含着泪光 -->
  <ellipse cx="98" cy="140" rx="13" ry="11" fill="url(#eyeGrad)" stroke="#a86b1c" stroke-width="2"/>
  <ellipse cx="142" cy="140" rx="13" ry="11" fill="url(#eyeGrad)" stroke="#a86b1c" stroke-width="2"/>
  <circle cx="94" cy="136" r="3" fill="#ffffff"/>
  <circle cx="138" cy="136" r="3" fill="#ffffff"/>
  <!-- 泪珠 -->
  <ellipse cx="108" cy="156" rx="4" ry="6" fill="#9ed0f5" opacity="0.9"/>

  <!-- 伤心的腮红（淡） -->
  <ellipse cx="86" cy="158" rx="11" ry="6" fill="#9a8a9e" opacity="0.3"/>
  <ellipse cx="154" cy="158" rx="11" ry="6" fill="#9a8a9e" opacity="0.3"/>

  <!-- 伤心的嘴（微微撇嘴下垂） -->
  <path d="M112 172 Q120 164 128 172" stroke="#3c6e94" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 小短手垂下来擦眼泪 -->
  <ellipse cx="50" cy="150" rx="14" ry="10" fill="#8fc2e4" stroke="#6fb0dc" stroke-width="2" transform="rotate(30 50 150)"/>
  <ellipse cx="190" cy="150" rx="14" ry="10" fill="#8fc2e4" stroke="#6fb0dc" stroke-width="2" transform="rotate(-30 190 150)"/>

  <!-- 尾巴也垂下去 -->
  <path d="M196 210 Q204 224 194 234" fill="none" stroke="#aed8f2" stroke-width="4" stroke-linecap="round"/>
</svg>