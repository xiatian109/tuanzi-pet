<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>团子精灵</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  /* 对话气泡 */
  #bubble {
    position: fixed;
    left: 50%;
    top: 8%;
    transform: translateX(-50%);
    max-width: 190px;
    background: rgba(255,255,255,0.96);
    color: #2f5a80;
    font-size: 13px;
    line-height: 1.5;
    padding: 8px 12px;
    border-radius: 14px;
    border: 2px solid #bcdcf1;
    box-shadow: 0 2px 8px rgba(74,147,199,0.25);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 10;
    white-space: normal;
  }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #bcdcf1;
  }
  #bubble.show { opacity: 1; }
  #pet {
    width: 200px;
    height: 220px;
    cursor: pointer;
  }
  /* 漂浮动画（只作用于外层容器整个 svg，不干扰内部五官定位） */
  .float-anim {
    animation: floaty 3.2s ease-in-out infinite;
    /* 不用 transform 做漂浮，改用 margin-top 避免 transform 影响 SVG 定位 */
    animation-name: floatyMar;
  }
  @keyframes floatyMar {
    0%   { margin-top: 0; }
    50%  { margin-top: -8px; }
    100% { margin-top: 0; }
  }
  /* 出现过渡：仅用透明度，不用 scale/transform（避免五官瞬间飞/错位） */
  .fade-in { animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
</style>

<script>
  // 表情状态机
  var faces = ['idle', 'happy', 'sad', 'angry', 'peek', 'sleepy', 'turn'];
  var current = 'idle';
  var idleTimer = null;
  var lastTouchTime = Date.now();

  function showFace(name) {
    if (name === current) { quickResetIdle(); return; }
    faces.forEach(function (f) {
      var el = document.getElementById('face-' + f);
      if (el) el.style.display = (f === name) ? '' : 'none';
    });
    current = name;
    var svg = document.getElementById('pet');
    svg.classList.remove('fade-in');
    void svg.getBoundingClientRect(); // 强制重绘重放淡入
    svg.classList.add('fade-in');
    quickResetIdle();
  }

  // 戳一下 → 开心
  function onPetTouch() {
    lastTouchTime = Date.now();
    if (lastClickTime > 0 && Date.now() - lastClickTime < 700) {
      // 快速连点 → 它"被戳秃了"
      showFace('angry');
      speak('好啦好啦，再戳要秃了啦！');
      setTimeout(function () { if (current === 'angry') showFace('idle'); }, 2000);
    } else {
      showFace('happy');
      var happyLines = ['嘿嘿，就知道你会来', '想我啦？', '戳这么用力干嘛～', '在在在，我一直都在'];
      speak(happyLines[Math.floor(Math.random() * happyLines.length)]);
      setTimeout(function () { if (current === 'happy') showFace('idle'); }, 2200);
    }
    lastClickTime = Date.now();
  }

  // 说话：让气泡显示一句话
  var bubbleTimer = null;
  function speak(text) {
    var b = document.getElementById('bubble');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { b.classList.remove('show'); }, 2400);
  }

  // 没人理太久 → 先偷看，然后埋怨，再气鼓鼓瞪你
  function quickResetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      showFace('peek');
      var ignoreLines = ['喂……还在吗', '哼，又把我晾一边', '我也不是非要你理我啦！'];
      speak(ignoreLines[Math.floor(Math.random() * ignoreLines.length)]);
      setTimeout(function () {
        if (current === 'peek') {
          showFace('angry');
          setTimeout(function () { if (current === 'angry') showFace('idle'); }, 2600);
        }
      }, 1400);
    }, 15000); // 15秒没人理
  }

  var lastClickTime = 0;

  // 日常小表情点缀：空闲时偶尔冒个开心/偷看/困，再回待机
  setInterval(function () {
    if (current !== 'idle') return;
    var r = Math.random();
    if (r < 0.25) {
      var moods = ['happy', 'peek'];
      var m = moods[Math.floor(Math.random() * moods.length)];
      showFace(m);
      if (m !== 'peek') {
        setTimeout(function () { if (current === m) showFace('idle'); }, 1800);
      }
    }
  }, 9000);

  document.getElementById('pet').addEventListener('click', onPetTouch);

  quickResetIdle();
</script>

</html>
